[package]
name = "flow-trust"
version = "0.1.0"
description = "FlowTrust — системный монитор процессов и инструмент форензики"
authors = ["FlowTrust"]
edition = "2021"

# Запрет запуска в консоли на Windows (Tauri скрывает консоль)
[[bin]]
name = "flow-trust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# Tauri — основной фреймворк
tauri = { version = "1.6", features = [
    "shell-open",
    "system-tray",
    "window-all",
] }

# Сериализация/десериализация данных для передачи во frontend
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Прямой доступ к Windows API
windows = { version = "0.52", features = [
    "Win32_System_Diagnostics_ToolHelp",    # TlHelp32 — снимок процессов
    "Win32_System_Threading",               # OpenProcess, GetProcessTimes, QueryFullProcessImageNameW
    "Win32_Security",                       # Token, SID, LookupAccountSid
    "Win32_System_ProcessStatus",           # GetProcessMemoryInfo
    "Win32_System_SystemInformation",       # GetSystemInfo
    "Win32_Foundation",                     # HANDLE, FILETIME, MAX_PATH
    "Win32_NetworkManagement_IpHelper",     # GetExtendedTcpTable, GetExtendedUdpTable
    "Win32_Networking_WinSock",             # AF_INET
    "Win32_System_Registry",               # RegOpenKeyExW, RegEnumValueW — автозагрузка
    "Win32_Security_WinTrust",             # WinVerifyTrust — проверка цифровых подписей
    "Win32_System_Diagnostics_Debug",      # IsDebuggerPresent — антидебаг
    "Win32_Storage_FileSystem",            # GetFileAttributesW — файловый менеджер
] }
url   = "2"
sha2  = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
